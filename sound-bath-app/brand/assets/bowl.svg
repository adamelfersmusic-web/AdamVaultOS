<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="300" height="260" role="img" aria-label="A crystal singing bowl with its mallet, lit from beneath">
  <!-- ==========================================================================
       THE BOWL — the companion. Ink only, lit from beneath by a SECTION colour
       (here --c-ground #5d6aa8). Never amber: the bowl is not the software and
       nothing in an illustration is making sound. Swap the two glow stops and
       the rim stroke to re-light it for any section.
       ========================================================================== -->
  <defs>
    <radialGradient id="bowlGlow" cx="50%" cy="82%" r="46%">
      <stop offset="0%" stop-color="#5d6aa8" stop-opacity=".62"/>
      <stop offset="100%" stop-color="#5d6aa8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bowlBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b3750"/>
      <stop offset="58%" stop-color="#2a2739"/>
      <stop offset="100%" stop-color="#4a4566"/>
    </linearGradient>
  </defs>

  <g transform="translate(0,-20)">
    <ellipse cx="150" cy="222" rx="132" ry="52" fill="url(#bowlGlow)"/>
    <path d="M62 140 C62 196 88 224 150 224 C212 224 238 196 238 140 Z" fill="url(#bowlBody)"/>
    <ellipse cx="150" cy="140" rx="88" ry="25" fill="#191824" stroke="#4a4566" stroke-width="2.4"/>
    <ellipse cx="150" cy="140" rx="88" ry="25" fill="none" stroke="#8e99b5" stroke-width="1" opacity=".55"/>
    <path d="M86 152 C88 190 106 212 138 218" stroke="#a29ab4" stroke-width="1.4" fill="none" opacity=".3"/>
    <!-- the mallet, resting against it -->
    <rect x="228" y="96" width="7" height="118" rx="3.5" transform="rotate(13 231 155)" fill="#2e2a3d"/>
    <circle cx="240" cy="94" r="17" fill="#3b3750"/>
    <circle cx="235" cy="89" r="5" fill="#4a4566"/>
  </g>
</svg>
