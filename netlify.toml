# Bed deploys straight from this folder — no copy, no drift.
# Every push to the connected branch is live in ~30s.
# This does NOT affect the repo's existing GitHub Pages workflow (different
# service, different product): that still builds public/ via Actions.
[build]
  publish = "sound-bath-app"
  command = ""

# The landing page is the front door; the app lives at /app/.
[[redirects]]
  from = "/"
  to = "/site/index.html"
  status = 200

# Short join link for follower phones: bed.example/join?c=ABCD
[[redirects]]
  from = "/join"
  to = "/app/index.html"
  status = 200

[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "no-cache"
