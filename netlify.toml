# Bed deploys from this folder — no copy, no drift.
# Every push to the connected branch is live in ~30s.
# This does NOT affect the repo's existing GitHub Pages workflow (different
# service, different product): that still builds public/ via Actions.
#
# ⚠️ Bed now lives in its own private repo (adamelfersmusic-web/bed) and
# deploys from there. This file is the older path, kept working until
# sound-bath-app/ comes out of this repo — at which point both should go.
#
# ── Why there is a build command for a site with no build ──────────────────
# The published directory is an ALLOWLIST assembled at deploy time, never the
# folder itself: only the landing page and the app reach the CDN. The brand
# book, the business model, BOOK, IDEAS-LOG, the prototype and the relay all
# live under sound-bath-app/ and must never get a public URL. Publishing the
# folder wholesale would have handed out the pricing strategy to anyone who
# guessed the path.
#
# ── ⚠️ The QR gate runs here, on the deploy path, on purpose ────────────────
# A wrong QR code has no visible failure mode: it looks completely normal and
# simply never scans, and you find out in front of a room. A check that depends
# on someone remembering to run it will, one day, not be run. So it is the
# first line of the build — if the encoder in app/index.html stops agreeing
# with an independent implementation, the build FAILS and the broken code never
# reaches the CDN. Takes 0.6s and needs nothing installed.
# ⚠️ `set -e` is load-bearing. A multi-line build command reports the exit
# status of its LAST line, so without it a failed check is followed by a
# successful copy and Netlify publishes the broken build with a green tick —
# a gate that reports nothing but its own presence.
# See sound-bath-app/tools/README.md.
[build]
  publish = "_site"
  command = """
    set -e
    node sound-bath-app/tools/qr-check.cjs
    rm -rf _site && mkdir -p _site/app
    cp sound-bath-app/site/index.html sound-bath-app/site/guide.html _site/
    cp sound-bath-app/app/index.html sound-bath-app/app/sw.js sound-bath-app/app/manifest.webmanifest _site/app/
    cp sound-bath-app/app/icon-192.png sound-bath-app/app/icon-512.png _site/app/
  """

# Short join link for follower phones: bed.example/join?c=ABCD
[[redirects]]
  from = "/join"
  to = "/app/index.html"
  status = 200

# An open device should always pick up the newest build, never a stale cache.
# The service worker is network-first for the same reason.
# ⚠️ BOTH rules are needed and neither is redundant. Netlify matches the REQUEST
# path, not the file it resolves to — and everybody opens /app/, not
# /app/index.html. With only the second rule the app is served from cache, and
# the failure mode is vicious: a laptop silently runs a build from before
# RELAY_URL was set, talks over BroadcastChannel, and no phone can ever reach
# it. Nothing errors. It just never connects.
[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "no-cache"
