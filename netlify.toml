# Netlify config for the Escensus training app.
# The public/ folder is the static site; netlify/functions holds the serverless
# scoring function (Talk-mode L3). GitHub Pages serves the same static site and
# simply ignores this file + the functions — scoring stays dormant there.
#
# To enable AI scoring on a Netlify deploy:
#   1. Set env vars in the Netlify UI:  ASSEMBLYAI_API_KEY  and  ANTHROPIC_API_KEY
#   2. In public/train/roleplay/index.html set  SCORE_ENDPOINT = '/.netlify/functions/score'

[build]
  publish = "public"
  functions = "netlify/functions"
